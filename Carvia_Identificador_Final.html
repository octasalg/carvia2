<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Carvía — Generador de Identificadores</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bk: #191817; --wt: #ffffff;
    --gy1: #F4F2EC; --gy2: #D8D5CD; --gy3: #999691;
    --og: #FF5D15; --og-dim: rgba(255,93,21,0.12); --og-border: rgba(255,93,21,0.28);
  }
  body { background: var(--bk); font-family: 'Archivo', sans-serif; display: flex; min-height: 100vh; }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,93,21,0.25); border-radius: 3px; }

  /* SIDEBAR */
  #sidebar {
    width: 340px; min-width: 300px; flex-shrink: 0;
    border-right: 1px solid rgba(255,93,21,0.12);
    display: flex; flex-direction: column; overflow-y: auto; height: 100vh; position: sticky; top: 0;
  }
  #sidebar-top {
    padding: 16px 22px; border-bottom: 1px solid rgba(255,93,21,0.12);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  }
  #sidebar-top img { height: 36px; width: auto; }
  .badge-a4 {
    background: var(--og-dim); border: 1px solid var(--og-border);
    color: var(--og); font-size: 9px; font-weight: 800;
    letter-spacing: 2px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase;
  }
  #sidebar-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .sidebar-title { color: #EFEBDF; font-weight: 900; font-size: 18px; letter-spacing: -0.5px; margin-bottom: 3px; }
  .sidebar-sub   { color: rgba(239,235,223,0.25); font-size: 11px; }

  /* CARDS */
  .card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,93,21,0.1);
    border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 11px;
  }
  .card-title { color: var(--og); font-weight: 800; font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { color: rgba(239,235,223,0.38); font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; }
  input, select {
    width: 100%; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(239,235,223,0.1);
    border-radius: 10px; padding: 10px 13px; color: #EFEBDF; font-size: 13px;
    font-family: 'Archivo', sans-serif; font-weight: 500; outline: none; transition: border-color .2s, background .2s;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, select:focus { border-color: var(--og); background: rgba(255,93,21,0.06); }
  input::placeholder { color: rgba(239,235,223,0.18); }
  select option { background: var(--bk); color: #EFEBDF; }
  .field-hint { color: var(--og); font-size: 10px; font-weight: 700; margin-top: 2px; opacity: 0.8; }

  /* Input con sufijo */
  .input-suffix-wrap { position: relative; }
  .input-suffix-wrap input { padding-right: 56px; }
  .input-suffix {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    color: var(--og); font-size: 11px; font-weight: 800; letter-spacing: 1px;
    pointer-events: none; font-family: 'Archivo', sans-serif;
  }

  /* Folio */
  .folio-card {
    background: var(--og-dim); border: 1px solid var(--og-border);
    border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
  }
  .folio-card label { color: var(--og); }
  .folio-card input {
    background: rgba(0,0,0,0.2); border-color: var(--og-border);
    color: #EFEBDF; font-weight: 900; font-size: 14px; letter-spacing: 1px;
  }
  .folio-card input:focus { border-color: var(--og); background: rgba(255,93,21,0.1); }
  .folio-hint { font-size: 9px; color: rgba(239,235,223,0.3); font-weight: 600; }

  /* Botones */
  .btn {
    border: none; border-radius: 12px; font-family: 'Archivo', sans-serif;
    font-weight: 800; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    cursor: pointer; width: 100%; padding: 12px; transition: transform .15s, opacity .15s, box-shadow .15s;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: .2; cursor: not-allowed; }
  .btn-og  { background: var(--og); color: #fff; box-shadow: 0 4px 16px rgba(255,93,21,0.28); }
  .btn-og:hover:not(:disabled) { box-shadow: 0 6px 24px rgba(255,93,21,0.42); }
  .btn-out { background: transparent; color: #EFEBDF; border: 1.5px solid rgba(255,93,21,0.22); }
  .btn-out:hover { border-color: var(--og); color: var(--og); }
  .hint { text-align: center; color: rgba(239,235,223,0.13); font-size: 10px; font-weight: 500; }

  /* PREVIEW */
  #preview-area {
    flex: 1; background: rgba(0,0,0,0.28);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 36px; overflow: auto;
  }
  .preview-label { color: rgba(255,93,21,0.3); font-size: 9px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 16px; align-self: flex-start; }
  #preview-wrapper { box-shadow: 0 32px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(255,93,21,0.15); border-radius: 2px; overflow: hidden; }
  #preview-scale   { transform-origin: top left; pointer-events: none; }
  .preview-sub { margin-top: 10px; color: rgba(255,93,21,0.2); font-size: 10px; font-weight: 600; }

  /* MODAL */
  #modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.94); z-index: 200;
    align-items: center; justify-content: center; padding: 16px;
  }
  #modal.open { display: flex; }
  #modal-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--og-dim); border: 1px solid var(--og-border); color: var(--og);
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 16px;
  }

  /* ══ IDENTIFICADOR ══ */
  .id-root {
    width: 1123px; height: 794px; display: flex; flex-direction: column;
    font-family: 'Archivo', sans-serif; background: #fff; overflow: hidden;
  }
  .id-topbar {
    padding: 12px 32px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1.5px solid #D8D5CD; flex-shrink: 0;
  }
  .id-topbar img { height: 52px; width: auto; }
  .id-topbar-right { display: flex; align-items: center; gap: 20px; }
  .id-badge { border: 1.5px solid #191817; color: #191817; font-size: 9px; font-weight: 800; letter-spacing: 2.5px; padding: 3px 12px; border-radius: 20px; text-transform: uppercase; }
  .id-site  { color: #999691; font-size: 10px; font-weight: 500; font-style: italic; }
  .id-body  { flex: 1; display: flex; overflow: hidden; }
  .id-left  { width: 590px; display: flex; flex-direction: column; justify-content: center; padding: 16px 32px 16px 36px; border-right: 1.5px solid #D8D5CD; }
  .id-field { font-weight: 900; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.0; }
  .id-field.filled { color: #191817; }
  .id-field.empty  { color: #D8D5CD; }
  .id-right { flex: 1; background: #fff; display: flex; flex-direction: column; padding: 18px 28px 14px 28px; }
  .id-specs-title { font-size: 8px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: #999691; margin-bottom: 14px; }

  /* Grid 2×3: filas 0 y 1 normales, fila 2 es la celda de enganche a full width */
  .id-specs-grid {
    flex: 1; display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 0;
  }
  .id-spec-cell { padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; }
  .id-spec-cell.br { border-right: 1.5px solid #D8D5CD; }
  .id-spec-cell.bb { border-bottom: 1.5px solid #D8D5CD; }
  /* Celda enganche ocupa las 2 columnas */
  .id-spec-cell.enganche { grid-column: 1 / -1; border-right: none; }
  .id-spec-lbl { font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #999691; margin-bottom: 4px; }
  .id-spec-val { font-weight: 900; color: #191817; letter-spacing: -0.5px; line-height: 1.1; }
  .id-spec-val.empty { color: #D8D5CD; }
  .id-no-specs { flex: 1; display: flex; align-items: center; justify-content: center; }
  .id-no-specs p { color: #D8D5CD; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.6; }

  /* Footer */
  .id-footer { border-top: 1.5px solid #D8D5CD; display: flex; align-items: stretch; flex-shrink: 0; }
  .id-footer-cell { display: flex; flex-direction: column; justify-content: center; padding: 12px 20px; border-right: 1.5px solid #D8D5CD; }
  .id-footer-cell.last { border-right: none; align-items: flex-end; padding-right: 24px; }
  .id-footer-cell.precio { min-width: 300px; padding: 12px 28px; }
  .id-footer-cell.km     { min-width: 160px; }
  .id-footer-cell.folio-cell { min-width: 170px; }
  .id-footer-lbl { color: #999691; font-size: 8px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 3px; }
  .id-footer-val { color: #191817; font-weight: 900; letter-spacing: -0.3px; }
  .id-footer-sub { color: #999691; font-size: 9px; font-weight: 600; margin-top: 3px; }

  @media print {
    body > * { display: none !important; }
    #print-target { display: block !important; }
    @page { size: A4 landscape; margin: 0; }
    #print-target .id-root { width: 297mm !important; height: 210mm !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-top">
    <img id="logo-sidebar" src="" alt="carvía"/>
    <span class="badge-a4">A4 · HORIZONTAL</span>
  </div>
  <div id="sidebar-body">
    <div>
      <div class="sidebar-title">Nuevo identificador</div>
      <div class="sidebar-sub">B&amp;N · A4 horizontal</div>
    </div>

    <div class="card">
      <div class="card-title">Vehículo</div>
      <div class="field"><label>Marca</label><input id="f-marca"   type="text" placeholder="Toyota"/></div>
      <div class="field"><label>Modelo</label><input id="f-modelo"  type="text" placeholder="Corolla"/></div>
      <div class="field"><label>Versión</label><input id="f-version" type="text" placeholder="Se 2.0l cvt"/></div>
      <div class="field"><label>Año</label><input id="f-año" type="text" placeholder="2022" maxlength="4"/></div>
      <div class="field">
        <label>Kilometraje</label>
        <input id="f-km" type="text" placeholder="35000"/>
        <span class="field-hint" id="hint-km"></span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Precio y Factura</div>
      <div class="field">
        <label>Precio de venta (MXN)</label>
        <input id="f-precio" type="text" placeholder="250000" style="font-weight:800"/>
        <span class="field-hint" id="hint-precio"></span>
      </div>
      <div class="field">
        <label>Tipo de factura</label>
        <select id="f-factura">
          <option value="">Seleccionar...</option>
          <option value="agencia">Factura de Agencia</option>
          <option value="empresa">Factura de Empresa</option>
          <option value="seminuevos">Factura de Seminuevos</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Especificaciones técnicas</div>
      <div class="field"><label>Motor</label><input id="s-motor" type="text" placeholder="2.0L 4 cilindros turbo"/></div>
      <div class="field">
        <label>Potencia</label>
        <div class="input-suffix-wrap">
          <input id="s-potencia" type="text" placeholder="170"/>
          <span class="input-suffix">HP</span>
        </div>
      </div>
      <div class="field">
        <label>Rendimiento combinado</label>
        <div class="input-suffix-wrap">
          <input id="s-rend" type="text" placeholder="12.5"/>
          <span class="input-suffix">KM/L</span>
        </div>
      </div>
      <div class="field">
        <label>Transmisión</label>
        <select id="s-trans">
          <option value="">Seleccionar...</option>
          <option value="Automático">Automático</option>
          <option value="Estándar">Estándar</option>
        </select>
      </div>
    </div>

    <div class="folio-card">
      <label for="f-folio">Folio</label>
      <input id="f-folio" type="text" placeholder="CV-AAMMDD-0000" spellcheck="false"/>
      <span class="folio-hint">Siempre debe comenzar con CV-</span>
    </div>

    <button class="btn btn-og"  id="btn-print"  disabled>🖨 &nbsp;Generar e Imprimir PDF</button>
    <button class="btn btn-out" id="btn-preview">👁 &nbsp;Vista previa</button>
    <p class="hint" id="hint-ready">Completa los campos requeridos para continuar.</p>
  </div>
</div>

<div id="preview-area">
  <div class="preview-label">Vista previa — A4 horizontal · B&amp;N (49%)</div>
  <div id="preview-wrapper"><div id="preview-scale"></div></div>
  <div class="preview-sub">297 × 210 mm</div>
</div>

<div id="modal">
  <button id="modal-close">✕</button>
  <div id="modal-inner"></div>
</div>

<div id="print-target" style="display:none"></div>

/* ── FOLIO ── */
function genFolio() {
  const d=new Date();
  return "CV-"+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+Math.floor(1000+Math.random()*9000);
}
document.getElementById("f-folio").value = genFolio();

document.getElementById("f-folio").addEventListener("input", function() {
  if (!this.value.startsWith("CV-")) {
    this.value = "CV-" + this.value.replace(/^[Cc][Vv]-?/,"");
  }
  const l = this.value.length; this.setSelectionRange(l,l);
  updatePreview();
});
document.getElementById("f-folio").addEventListener("keydown", function(e) {
  if ((e.key==="Backspace"||e.key==="Delete") && this.selectionStart<=3 && this.selectionStart===this.selectionEnd) e.preventDefault();
});

/* ── UTILS ── */
const fmtKm     = v => { const n=parseInt(v.replace(/\D/g,""),10); return isNaN(n)?"":n.toLocaleString("es-MX")+" km"; };
const fmtPrecio = v => { const n=parseInt(v.replace(/\D/g,""),10); return isNaN(n)?"":"$"+n.toLocaleString("es-MX"); };
const today     = () => new Date().toLocaleDateString("es-MX",{day:"2-digit",month:"long",year:"numeric"});
const capitalize= s => s ? s.charAt(0).toUpperCase()+s.slice(1).toLowerCase() : s;

function fitFont(text, maxW, maxSize=108, minSize=30) {
  if(!text) return maxSize;
  return Math.min(maxSize, Math.max(minSize, Math.floor(maxW/(text.length*0.58))));
}

/* ── CALCULAR ENGANCHE ── */
function calcEnganche(año, precio) {
  const y = parseInt(año, 10);
  const p = parseInt((precio||"").replace(/\D/g,""), 10);
  if (!y || !p) return null;
  const pct  = y <= 2019 ? 0.15 : 0.10;
  const monto = Math.round(p * pct);
  const label = y <= 2019 ? "15%" : "10%";
  return { monto, label, pct };
}

/* ── BUILD IDENTIFIER ── */
function buildIdentifier() {
  const marca   = capitalize(document.getElementById("f-marca").value.trim());
  const modelo  = capitalize(document.getElementById("f-modelo").value.trim());
  const version = capitalize(document.getElementById("f-version").value.trim());
  const año     = capitalize(document.getElementById("f-año").value.trim());
  const km      = document.getElementById("f-km").value.trim();
  const precio  = document.getElementById("f-precio").value.trim();
  const factura = document.getElementById("f-factura").value;
  const folio   = document.getElementById("f-folio").value.trim();

  const motor    = document.getElementById("s-motor").value.trim();
  const potNum   = document.getElementById("s-potencia").value.trim();
  const potencia = potNum ? potNum+" HP" : "";
  const rendNum  = document.getElementById("s-rend").value.trim();
  const rend     = rendNum ? rendNum+" km/l" : "";
  const trans    = document.getElementById("s-trans").value;

  const facturaLabels = {agencia:"Factura de Agencia",empresa:"Factura de Empresa",seminuevos:"Factura de Seminuevos"};
  const facturaBadges = {agencia:"AGENCIA",empresa:"EMPRESA",seminuevos:"SEMINUEVOS"};
  const facturaLabel  = facturaLabels[factura]||"";
  const facturaBadge  = facturaBadges[factura]||"";

  const longest = [marca,modelo,version,año].reduce((a,b)=>b.length>a.length?b:a,"");
  const fs = fitFont(longest, 526, 108, 30);
  const ls = fs>70?-3:-1;

  const hasSpecs = motor||potencia||rend||trans;
  const precioFmt = fmtPrecio(precio);
  const precioFs  = fitFont(precioFmt, 270, 64, 28);

  // Enganche
  const enganche = calcEnganche(document.getElementById("f-año").value.trim(), precio);
  const engancheVal = enganche
    ? `${fmtPrecio(String(enganche.monto))} <span style="font-size:18px;font-weight:700;color:#999691">(${enganche.label} del precio de venta)</span>`
    : '<span style="color:#D8D5CD;font-size:22px">— Completa año y precio</span>';

  // Grid de specs: 4 celdas normales (2×2) + 1 celda enganche a full width (fila 3)
  const topCells = [
    {lbl:"Motor",                val:motor},
    {lbl:"Potencia",             val:potencia},
    {lbl:"Rendimiento combinado",val:rend},
    {lbl:"Transmisión",          val:trans},
  ];
  const specValFs = 30;

  const specsHtml = hasSpecs || enganche
    ? `<div class="id-specs-grid">
        ${topCells.map((s,i)=>{
          const col=i%2, row=Math.floor(i/2);
          const cls=["id-spec-cell",col<1?"br":"",row<1?"bb":""].filter(Boolean).join(" ");
          return `<div class="${cls}">
            <div class="id-spec-lbl">${s.lbl}</div>
            <div class="id-spec-val${s.val?"":" empty"}" style="font-size:${specValFs}px">${s.val||"—"}</div>
          </div>`;
        }).join("")}
        <div class="id-spec-cell enganche bb" style="border-top:1.5px solid #D8D5CD">
          <div class="id-spec-lbl">Enganche desde</div>
          <div class="id-spec-val" style="font-size:36px">${engancheVal}</div>
        </div>
      </div>`
    : `<div class="id-no-specs"><p>Ingresa las especificaciones<br>en el formulario</p></div>`;

  const fields=[
    {val:marca,ph:"Marca"},{val:modelo,ph:"Modelo"},{val:version,ph:"Versión"},{val:año,ph:"Año"},
  ].map(f=>`<div class="id-field ${f.val?"filled":"empty"}" style="font-size:${fs}px;letter-spacing:${ls}px">${f.val||f.ph}</div>`).join("");

  return `
  <div class="id-root">
    <div class="id-topbar">
      <img src="data:image/png;base64,${LOGO_BLACK}" alt="carvía" style="height:52px;width:auto"/>
      <div class="id-topbar-right">
        ${facturaBadge?`<span class="id-badge">${facturaBadge}</span>`:""}
        <span class="id-site">Conoce todo nuestro catálogo en carvia.mx</span>
      </div>
    </div>
    <div class="id-body">
      <div class="id-left">${fields}</div>
      <div class="id-right">
        <div class="id-specs-title">Especificaciones técnicas</div>
        ${specsHtml}
      </div>
    </div>
    <div class="id-footer">
      <div class="id-footer-cell precio">
        <div class="id-footer-lbl">Precio de venta</div>
        <div class="id-footer-val" style="font-size:${precioFs}px;letter-spacing:-2px">
          ${precioFmt||'<span style="color:#D8D5CD;font-size:24px">— MXN</span>'}
        </div>
      </div>
      <div class="id-footer-cell km">
        <div class="id-footer-lbl">Kilometraje</div>
        <div class="id-footer-val" style="font-size:18px">${km?fmtKm(km):'<span style="color:#D8D5CD">—</span>'}</div>
      </div>
      <div class="id-footer-cell" style="flex:1">
        <div class="id-footer-lbl">Tipo de factura</div>
        <div class="id-footer-val" style="font-size:16px">${facturaLabel||'<span style="color:#D8D5CD">—</span>'}</div>
      </div>
      <div class="id-footer-cell last folio-cell">
        <div class="id-footer-lbl">Folio</div>
        <div class="id-footer-val" style="font-size:13px;letter-spacing:1px">${folio||"CV-"}</div>
        <div class="id-footer-sub">${today()}</div>
      </div>
    </div>
  </div>`;
}

/* ── UPDATE ── */
const SCALE=0.49;
function updatePreview() {
  const html=buildIdentifier();
  const scaleDiv=document.getElementById("preview-scale");
  const wrapper=document.getElementById("preview-wrapper");
  scaleDiv.innerHTML=html;
  scaleDiv.style.transform=`scale(${SCALE})`;
  wrapper.style.width=Math.round(1123*SCALE)+"px";
  wrapper.style.height=Math.round(794*SCALE)+"px";
  wrapper.style.overflow="hidden";
  document.getElementById("print-target").innerHTML=html;
  document.getElementById("modal-inner").innerHTML=
    `<div style="width:${Math.round(1123*0.44)}px;height:${Math.round(794*0.44)}px;overflow:hidden">
      <div style="transform:scale(0.44);transform-origin:top left">${html}</div>
     </div>`;
  const isReady=document.getElementById("f-marca").value.trim()&&
    document.getElementById("f-modelo").value.trim()&&
    document.getElementById("f-año").value.trim()&&
    document.getElementById("f-km").value.trim()&&
    document.getElementById("f-factura").value;
  document.getElementById("btn-print").disabled=!isReady;
  document.getElementById("hint-ready").style.display=isReady?"none":"block";
}

/* ── LISTENERS ── */
["f-marca","f-modelo","f-version","f-año"].forEach(id=>{
  const el=document.getElementById(id);
  el.addEventListener("blur",function(){ if(this.value) this.value=capitalize(this.value.trim()); updatePreview(); });
  el.addEventListener("input",updatePreview);
});
document.getElementById("f-km").addEventListener("input",function(){
  this.value=this.value.replace(/\D/g,"");
  document.getElementById("hint-km").textContent=this.value?fmtKm(this.value):"";
  updatePreview();
});
document.getElementById("f-precio").addEventListener("input",function(){
  this.value=this.value.replace(/\D/g,"");
  document.getElementById("hint-precio").textContent=this.value?fmtPrecio(this.value)+" MXN":"";
  updatePreview();
});
document.getElementById("f-año").addEventListener("input",function(){
  this.value=this.value.replace(/\D/g,"").slice(0,4);
  updatePreview();
});
document.getElementById("s-potencia").addEventListener("input",function(){ this.value=this.value.replace(/\D/g,""); updatePreview(); });
document.getElementById("s-rend").addEventListener("input",function(){ this.value=this.value.replace(/[^\d.]/g,""); updatePreview(); });
["f-factura","s-motor","s-trans"].forEach(id=>{
  document.getElementById(id).addEventListener("input",updatePreview);
  document.getElementById(id).addEventListener("change",updatePreview);
});

document.getElementById("btn-print").addEventListener("click",()=>window.print());
document.getElementById("btn-preview").addEventListener("click",()=>document.getElementById("modal").classList.add("open"));
document.getElementById("modal-close").addEventListener("click",()=>document.getElementById("modal").classList.remove("open"));
document.getElementById("modal").addEventListener("click",function(e){ if(e.target===this) this.classList.remove("open"); });

updatePreview();
</script>
</body>
</html>
